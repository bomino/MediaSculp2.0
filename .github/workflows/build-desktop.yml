name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build the app
        run: python build_desktop.py

      - name: Package the folder
        run: Compress-Archive -Path dist/MediaSculp/* -DestinationPath MediaSculp-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaSculp-windows
          path: MediaSculp-windows.zip

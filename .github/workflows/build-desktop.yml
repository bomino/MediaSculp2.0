name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Vendor the Deno JS runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtimes | Out-Null
          $url = "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile deno.zip
          Expand-Archive -Path deno.zip -DestinationPath runtimes -Force
          Remove-Item deno.zip
          & runtimes/deno.exe --version

      - name: Build the app
        run: python build_desktop.py

      - name: Package the folder
        run: Compress-Archive -Path dist/MediaSculp/* -DestinationPath MediaSculp-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaSculp-windows
          path: MediaSculp-windows.zip

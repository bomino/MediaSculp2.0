<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}MediaSculp — media toolkit{% endblock %}</title>

    <!-- Set theme before paint to avoid a flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    
    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='QidayaLogo-small.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='QidayaLogo-small.png') }}">
</head>
<body>
    <!-- Ultra-Compact Professional Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="{{ url_for('static', filename='QidayaLogo-small.png') }}" 
                     alt="Qidaya Logo" 
                     height="28">
                <div>
                    <span>MediaSculp</span>
                    <small>media toolkit</small>
                </div>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <i class="fas fa-home"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/downloads' %}active{% endif %}" href="/downloads">
                            <i class="fas fa-download"></i> Downloads
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/trimmed_videos' %}active{% endif %}" href="{{ url_for('downloads.trimmed_videos') }}">
                            <i class="fas fa-cut"></i> Trimmed
                        </a>
                    </li>
                    <li class="nav-item d-flex align-items-center ms-lg-1 mt-2 mt-lg-0">
                        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme" title="Toggle theme">
                            <i class="fas fa-moon" aria-hidden="true"></i>
                            <i class="fas fa-sun" aria-hidden="true"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div id="downloadsPanel" class="downloads-panel" style="display: none;"></div>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <img src="{{ url_for('static', filename='QidayaLogo-small.png') }}" alt="Qidaya">
                <span>MediaSculp</span>
            </div>
            <nav aria-label="Footer">
                <a href="/">Home</a>
                <a href="/downloads">Downloads</a>
                <a href="{{ url_for('downloads.trimmed_videos') }}">Trimmed</a>
                <a href="https://github.com/bomino/MediaSculp2.0" target="_blank" rel="noopener">GitHub</a>
            </nav>
            <div class="footer-copy">© {{ current_year if current_year else 2026 }} MediaSculp</div>
        </div>
    </footer>

    <!-- Modals -->
    <!-- Upload Video Modal -->
    <div class="modal fade" id="uploadVideoModal" tabindex="-1" aria-labelledby="uploadVideoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadVideoModalLabel">
                        <i class="fas fa-upload"></i> Upload Video
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form action="/upload" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="video" class="form-label">Choose Video File</label>
                            <input type="file" class="form-control" id="video" name="video" accept="video/*" required>
                            <div class="help-text">Supported formats: MP4, MOV, AVI, MKV</div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="fas fa-cloud-upload-alt"></i> Upload Video
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme toggle -->
    <script>
        (function () {
            var btn = document.getElementById('themeToggle');
            if (!btn) { return; }
            btn.addEventListener('click', function () {
                var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) {}
            });
        })();
    </script>

    <script src="{{ url_for('static', filename='downloads-panel.js') }}"></script>

    {% block scripts %}
    {% endblock %}
</body>
</html>

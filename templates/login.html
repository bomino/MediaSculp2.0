<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Sign in — MediaSculp</title>

    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='QidayaLogo-small.png') }}" type="image/png">
</head>
<body class="login-page">
    <main class="login-wrap">
        <div class="card login-card">
            <div class="card-body">
                <div class="login-brand">
                    <img src="{{ url_for('static', filename='QidayaLogo-small.png') }}" alt="Qidaya" height="36">
                    <div>
                        <span>MediaSculp</span>
                        <small>media toolkit</small>
                    </div>
                </div>

                {% if error %}
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-circle" aria-hidden="true"></i> {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" autofocus required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-right-to-bracket" aria-hidden="true"></i> Sign in
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>

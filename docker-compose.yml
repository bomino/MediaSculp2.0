services:
  mediasculp:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./trimmed_videos:/app/trimmed_videos
    environment:
      - FLASK_DEBUG=0
      # Keep the history DB on the downloads volume so it survives rebuilds.
      - DATABASE=/app/downloads/.mediasculp.db
      # Set a fixed SECRET_KEY so sessions/CSRF tokens survive a restart:
      # - SECRET_KEY=replace-with-a-random-value
      # Tune how many downloads run at once:
      # - MAX_CONCURRENT_DOWNLOADS=3
    restart: unless-stopped
    # Single instance only — the download-job registry is in-memory. Do not scale.

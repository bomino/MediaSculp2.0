services:
  mediasculp:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./trimmed_videos:/app/trimmed_videos
    environment:
      - FLASK_DEBUG=0
      # Keep the history DB on the downloads volume so it survives rebuilds.
      - DATABASE=/app/downloads/.mediasculp.db
      # Set a fixed SECRET_KEY so sessions/CSRF tokens survive a restart:
      # - SECRET_KEY=replace-with-a-random-value
      # Tune how many downloads run at once:
      # - MAX_CONCURRENT_DOWNLOADS=3
      # PO-token provider for hardened YouTube — see the bgutil-provider service
      # below. Also build this image with the bgutil plugin (add a line to the
      # Dockerfile: RUN pip install bgutil-ytdlp-pot-provider), then uncomment:
      # - POT_PROVIDER_URL=http://bgutil-provider:4416
    # depends_on:
    #   - bgutil-provider
    restart: unless-stopped
    # Single instance only — the download-job registry is in-memory. Do not scale.

  # Optional PO-token provider (uncomment this service + the app settings above).
  # Robust fix for "Only images are available" / SABR-gated videos.
  # bgutil-provider:
  #   image: brainicism/bgutil-ytdlp-pot-provider
  #   restart: unless-stopped
  #   expose:
  #     - "4416"
